// Chargement avec plusieurs sources : si le CDN principal échoue, essayer une source de secours.
window.__xlsxReady = new Promise((resolve, reject) => {
  if (window.XLSX) return resolve(window.XLSX);
  const urls = [
    'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js',
    'https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js'
  ];
  let index = 0;
  const next = () => {
    if (window.XLSX) return resolve(window.XLSX);
    if (index >= urls.length) return reject(new Error('Bibliothèque Excel indisponible. Vérifiez la connexion Internet.'));
    const script = document.createElement('script');
    script.src = urls[index++]; script.async = true;
    script.onload = () => window.XLSX ? resolve(window.XLSX) : next();
    script.onerror = next;
    document.head.appendChild(script);
  };
  next();
});
</script>

<script>
    // ===== Synchronisation cloud Supabase =====
    const SUPABASE_URL = 'https://uxomrkwdunydpunpycoz.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_dNYTj1D5MH-cRSkfqrrtUw_U5mSm1_2';
    const SYNC_TABLE = 'asei_sync_state';
    let sbClient = null;
    let syncUser = null;
    let syncTimer = null;
    let syncBusy = false;
    let syncPendingWrite = false;

    function syncSetIndicator(connected) {
        const dot = document.getElementById('syncIndicatorDot');
        if (dot) dot.classList.toggle('connected', !!connected);
    }

    function syncSetStatus(message, cls='') {
        const el = document.getElementById('syncStatus');
        if (el) { el.textContent = message; el.className = 'sync-status ' + cls; }
        if (cls === 'sync-ok') syncSetIndicator(true);
        else if (cls === 'sync-err' || cls === 'sync-warn') syncSetIndicator(false);
    }
    function syncSetUser(user) {
        const el = document.getElementById('syncUser');
        if (el) el.textContent = user ? ('Connecté : ' + (user.email || user.id)) : 'Non connecté';
    }
    function syncInit() {
        if (!window.supabase || !window.supabase.createClient) {
            syncSetStatus('Bibliothèque cloud indisponible. L’application reste utilisable hors ligne.', 'sync-warn');
            return;
        }
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        sbClient.auth.getSession().then(({data}) => {
            syncUser = data.session ? data.session.user : null;
            syncSetUser(syncUser);
            if (syncUser) { syncSetStatus('Connexion cloud active.'); syncInitialLoad(); }
        }).catch(() => syncSetStatus('Impossible de vérifier la connexion cloud.', 'sync-warn'));
        sbClient.auth.onAuthStateChange((event, session) => {
            syncUser = session ? session.user : null;
            syncSetUser(syncUser);
            if (syncUser) {
                syncSetStatus('Connecté. Synchronisation en cours…');
                syncInitialLoad();
                if (syncTimer) clearInterval(syncTimer);
                syncTimer = setInterval(() => { if (document.visibilityState !== 'hidden') syncPull(false); }, 15000);
            } else {
                if (syncTimer) clearInterval(syncTimer);
                syncSetStatus('Non connecté. Les données restent enregistrées sur cet appareil.', 'sync-warn');
            }
        });
    }
    async function syncLogin() {
        if (!sbClient) return syncSetStatus('Service cloud indisponible.', 'sync-err');
        const email = document.getElementById('syncEmail').value.trim();
        const password = document.getElementById('syncPassword').value;
        if (!email || !password) return alert('Saisissez votre e-mail et votre mot de passe.');
        syncSetStatus('Connexion…');
        const {error} = await sbClient.auth.signInWithPassword({email, password});
        if (error) syncSetStatus('Erreur de connexion : ' + error.message, 'sync-err');
    }
    async function syncSignup() {
        if (!sbClient) return syncSetStatus('Service cloud indisponible.', 'sync-err');
        const email = document.getElementById('syncEmail').value.trim();
        const password = document.getElementById('syncPassword').value;
        if (!email || !password) return alert('Saisissez votre e-mail et un mot de passe.');
        if (password.length < 6) return alert('Le mot de passe doit contenir au moins 6 caractères.');
        syncSetStatus('Création du compte…');
        const {data, error} = await sbClient.auth.signUp({email, password});
        if (error) return syncSetStatus('Erreur de création : ' + error.message, 'sync-err');
        if (data.session) syncSetStatus('Compte créé et connecté.');
        else syncSetStatus('Compte créé. Vérifiez votre e-mail si Supabase demande une confirmation.', 'sync-warn');
    }
    async function syncLogout() {
        if (!sbClient) return;
        await sbClient.auth.signOut();
        syncSetStatus('Déconnecté. Données locales conservées.', 'sync-warn');
    }
    async function syncReadCloud() {
        if (!syncUser) return null;
        const {data, error} = await sbClient.from(SYNC_TABLE).select('data,lists,updated_at').eq('user_id', syncUser.id).maybeSingle();
        if (error) throw error;
        return data;
    }
    async function syncWriteCloud() {
        if (!syncUser) return false;
        const payload = {user_id: syncUser.id, data: donnees, lists: listes, updated_at: new Date().toISOString()};
        const {error} = await sbClient.from(SYNC_TABLE).upsert(payload, {onConflict:'user_id'});
        if (error) throw error;
        return true;
    }
    async function syncInitialLoad() {
        if (syncBusy || !syncUser) return;
        syncBusy = true;
        try {
            const cloud = await syncReadCloud();
            const localHasData = Array.isArray(donnees) && donnees.length > 0;
            if (cloud && Array.isArray(cloud.data)) {
                donnees = cloud.data;
                if (cloud.lists && typeof cloud.lists === 'object') listes = cloud.lists;
                sauvegarderDonnees(); sauvegarderListes();
                rafraichirListeEmails();
                recalculerCalculsJournaliers(); rafraichirTableau();
                syncSetStatus('Données récupérées depuis le cloud.', 'sync-ok');
            } else if (localHasData || Object.keys(listes || {}).length) {
                await syncWriteCloud();
                syncSetStatus('Données locales envoyées vers le cloud.', 'sync-ok');
            } else {
                syncSetStatus('Cloud prêt. Aucune saisie enregistrée.', 'sync-ok');
            }
        } catch(e) { syncSetStatus('Erreur de synchronisation : ' + (e.message || e), 'sync-err'); }
        finally { syncBusy = false; }
    }
    async function syncPull(show=true) {
        if (!syncUser || syncBusy) return;
        syncBusy = true;
        try {
            const cloud = await syncReadCloud();
            if (cloud && Array.isArray(cloud.data)) {
                donnees = cloud.data;
                if (cloud.lists && typeof cloud.lists === 'object') listes = cloud.lists;
                sauvegarderDonnees(); sauvegarderListes();
                rafraichirListeEmails();
                recalculerCalculsJournaliers(); rafraichirTableau();
                if (show) syncSetStatus('Synchronisation terminée.', 'sync-ok');
            }
        } catch(e) { if (show) syncSetStatus('Erreur : ' + (e.message || e), 'sync-err'); }
        finally {
            syncBusy = false;
            if (syncPendingWrite && syncUser) syncAfterLocalChange();
        }
    }
    async function syncNow() {
        if (!syncUser) return alert('Connectez-vous d’abord au cloud.');
        if (syncBusy) return;
        syncBusy = true;
        try {
            await syncWriteCloud();
            syncSetStatus('Synchronisation terminée : données envoyées.', 'sync-ok');
        } catch(e) { syncSetStatus('Erreur de synchronisation : ' + (e.message || e), 'sync-err'); }
        finally { syncBusy = false; }
    }
    async function syncAfterLocalChange() {
        if (!syncUser) return;
        syncPendingWrite = true;
        if (syncBusy) return;
        syncBusy = true;
        try {
            while (syncPendingWrite) {
                syncPendingWrite = false;
                await syncWriteCloud();
            }
            syncSetStatus('Données synchronisées.', 'sync-ok');
        } catch(e) {
            syncSetStatus('Données locales conservées. Synchronisation impossible : ' + (e.message || e), 'sync-warn');
        } finally {
            syncBusy = false;
        }
    }

                    if (id === 'groupe') synchroniserIdProjetDepuisGroupe();

                    if (id === 'groupe') synchroniserIdProjetDepuisGroupe();
                    if (id === 'type' || id === 'dossier') appliquerAutomatismes();
                };
                dropdown.appendChild(div);
            });
            dropdown.style.display = 'block';
        }

        input.addEventListener('focus', () => renderDropdown(''));
        input.addEventListener('click', () => renderDropdown(''));
        input.addEventListener('touchstart', () => renderDropdown(''));
        input.addEventListener('input', () => {
            renderDropdown(input.value);
            if (id === 'groupe') synchroniserIdProjetDepuisGroupe();
            if (id === 'type' || id === 'dossier') appliquerAutomatismes();
        });
        
        arrow.addEventListener('click', (e) => {

            if (dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
            } else {
                renderDropdown('');
                input.focus();
            }
        });

        arrow.addEventListener('touchend', (e) => {
            e.stopPropagation();
            e.preventDefault();
            if (dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
            } else {
                renderDropdown('');
                input.focus();
            }
        });

        document.addEventListener('click', (e) => {
            if (!container.contains(e.target)) dropdown.style.display = 'none';
        });

        document.addEventListener('touchend', (e) => {
            if (!container.contains(e.target)) dropdown.style.display = 'none';
        });

    function getIsoWeek(dateStr) {
        const d = new Date(dateStr);
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() + 4 - (d.getDay() || 7));
        const yearStart = new Date(d.getFullYear(), 0, 1);
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function timeToMinutes(timeStr) {
        if (!timeStr) return 0;
        const parts = timeStr.split(':');
        return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }

    function minutesToTime(totalMinutes) {
        const h = Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`;
    }

    function recalculerCalculsJournaliers() {
        const totauxParDate = {};
        donnees.forEach(d => {
            const mins = timeToMinutes(d['Temps Reel']);
            totauxParDate[d.Date] = (totauxParDate[d.Date] || 0) + mins;
        });

        const dernierIndexParDate = {};
        donnees.forEach((d, index) => {
            dernierIndexParDate[d.Date] = index;
        });

        donnees.forEach((d, index) => {
            if (index === dernierIndexParDate[d.Date]) {
                d['Calcul'] = minutesToTime(totauxParDate[d.Date]);
            } else {
                d['Calcul'] = '';
            }
        });
    }

        const dates = Object.keys(parDate).sort();
        let html = '<div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; min-width:520px;">';
        html += '<thead><tr><th style="text-align:left;padding:7px;border-bottom:1px solid #cbd5e1;">Date</th>';
        groupes.forEach(g => { html += `<th style="text-align:center;padding:7px;border-bottom:1px solid #cbd5e1;">${escapeHtml(g)}</th>`; });
        html += '<th style="text-align:center;padding:7px;border-bottom:1px solid #cbd5e1;">Total jour</th></tr></thead><tbody>';

        dates.forEach(date => {
            let totalJour = 0;
            html += `<tr contenteditable="false"><td style="padding:7px;border-bottom:1px solid #e2e8f0;font-weight:600;">${escapeHtml(formatDateFR(date))}</td>`;
            groupes.forEach(g => {
                const mins = parDate[date][g] || 0;
                totalJour += mins;
                html += `<td contenteditable="false" style="padding:7px;border-bottom:1px solid #e2e8f0;text-align:center;">${mins ? escapeHtml(minutesToTime(mins).slice(0,5)) + ' h' : '—'}</td>`;
            });
            html += `<td contenteditable="false" style="padding:7px;border-bottom:1px solid #e2e8f0;text-align:center;font-weight:700;">${minutesToTime(totalJour).slice(0,5)} h</td></tr>`;
        });

        html += '<tr contenteditable="false" style="background:#eef2f7;font-weight:700;"><td style="padding:8px;">TOTAL GÉNÉRAL</td>';
        groupes.forEach(g => {
            const mins = general[g] || 0;
            html += `<td contenteditable="false" style="padding:8px;text-align:center;">${minutesToTime(mins).slice(0,5)} h</td>`;
        });
        html += `<td contenteditable="false" style="padding:8px;text-align:center;">${minutesToTime(totalGeneralMinutes).slice(0,5)} h</td></tr>`;
        html += '</tbody></table></div>';
        conteneur.innerHTML = html;
    }

    function rafraichirTableau() {
        document.getElementById('count').innerText = donnees.length;
        const tbody = document.querySelector('#tableauSaisies tbody');
        tbody.innerHTML = '';
        donnees.forEach((d, index) => {
            const couleurDate = couleurPastelPourDate(d.Date, index);
            const couleurProjet = couleurPourIdProjet(d.IDPROJET);
            const tr = `<tr>
                <td>${d.S}</td>
                <td style="background-color:${couleurDate}; font-weight:600;">${formatDateFR(d.Date)}</td>
                <td style="background-color:${couleurProjet}; font-weight:600;">${escapeHtml(d.IDPROJET || '')}</td>
                <td>${escapeHtml(d.Groupe || '')}</td>
                <td>${escapeHtml(d.Type || '')}</td>
                <td>${escapeHtml(d.Dossier || '')}</td>
                <td>${escapeHtml(d.Détails || '')}</td>
                <td>${escapeHtml(d['Temps Reel'] || '')}</td>
                <td><strong>${d.Calcul}</strong></td>
                <td><button class="btn-insert-row" type="button" onclick="preparerInsertion(${index}, true)" title="Ajouter une ligne avant">⬆️</button><button class="btn-insert-row" type="button" onclick="preparerInsertion(${index}, false)" title="Ajouter une ligne après">⬇️</button><button class="btn-edit-row" type="button" onclick="ouvrirModification(${index})" title="Modifier cette ligne">✏️</button><button class="btn-delete-row" type="button" onclick="supprimerLigne(${index})" title="Effacer cette ligne">🗑️</button></td>
            </tr>`;
            tbody.innerHTML += tr;
        });
        afficherTotauxHeuresParGroupe();
    }


    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function escapeHtmlAttr(value) {
        return escapeHtml(value);
    }

    let insertionIndex = null;

    function preparerInsertion(index, avant) {
        if (index < 0 || index >= donnees.length) return;
        insertionIndex = avant ? index : index + 1;
        document.getElementById('idProjet').value = '';
        document.getElementById('groupe').value = '';
        document.getElementById('type').value = '';
        document.getElementById('dossier').value = '';
        document.getElementById('details').value = '';
        document.getElementById('tempsHeures').value = '00';
        document.getElementById('tempsMinutes').value = '00';
        document.getElementById('dateInput').value = donnees[index].Date || document.getElementById('dateInput').value;
        const position = avant ? 'avant' : 'après';
        const mode = document.getElementById('modeInsertion');
        mode.textContent = `✏️ Remplissez la nouvelle ligne ${position} de la ligne ${index + 1}, puis validez avec « Insérer la ligne ».`;
        mode.style.display = 'block';
        const bouton = document.getElementById('btnAjouterLigne');
        bouton.textContent = 'Insérer la ligne';
        bouton.style.background = '#0f766e';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function annulerInsertion() {
        insertionIndex = null;
        const mode = document.getElementById('modeInsertion');
        if (mode) mode.style.display = 'none';
        const bouton = document.getElementById('btnAjouterLigne');
        if (bouton) { bouton.textContent = 'Ajouter la ligne'; bouton.style.background = ''; }
    }

    let indexLigneModification = -1;

    function ouvrirModification(index) {
        if (index < 0 || index >= donnees.length) return;
        indexLigneModification = index;
        const champ = document.getElementById('editField');
        const valeur = document.getElementById('editValue');
        champ.value = 'Date';
        valeur.value = donnees[index]['Date'] || '';
        document.getElementById('editModal').style.display = 'flex';
        valeur.focus();
    }

    document.getElementById('editField').addEventListener('change', function() {
        if (indexLigneModification < 0) return;
        document.getElementById('editValue').value = donnees[indexLigneModification][this.value] || '';
    });

    function annulerModification() {
        indexLigneModification = -1;
        document.getElementById('editModal').style.display = 'none';
    }

    function enregistrerModification() {
        if (indexLigneModification < 0 || indexLigneModification >= donnees.length) return;
        const champ = document.getElementById('editField').value;
        let valeur = document.getElementById('editValue').value.trim();
        if (!valeur) {
            alert('Veuillez saisir une valeur.');
            return;
        }
        if (champ === 'Temps Reel') {
            if (!/^\d{1,2}:\d{2}(:\d{2})?$/.test(valeur)) {
                alert('Le temps doit être au format HH:MM ou HH:MM:SS.');
                return;
            }
            if (valeur.split(':').length === 2) valeur += ':00';
        }
        donnees[indexLigneModification][champ] = valeur;
        if (champ === 'Date') {
            donnees[indexLigneModification]['S'] = getIsoWeek(valeur);
        }
        if (['IDPROJET','Groupe','Type','Dossier','Détails'].includes(champ)) {
            const map = {IDPROJET:'idProjet', Groupe:'groupe', Type:'type', Dossier:'dossier', Détails:'details'};
            if (map[champ]) ajouterSiNouveau(map[champ], valeur);
        }
        recalculerCalculsJournaliers();
        sauvegarderDonnees();
        rafraichirTableau();
        syncAfterLocalChange();
        annulerModification();
    }

    function supprimerLigne(index) {
        if (index < 0 || index >= donnees.length) return;
        if (confirm("Voulez-vous vraiment effacer cette ligne ?")) {
            donnees.splice(index, 1);
            recalculerCalculsJournaliers();
            sauvegarderDonnees();
            rafraichirTableau();
            syncAfterLocalChange();
        }
    }

    function viderHistorique() {
        if (confirm("Voulez-vous vraiment effacer toutes les saisies enregistrées ?")) {
            donnees = [];
            localStorage.removeItem('asei_donnees_proximite');
            rafraichirTableau();
            syncAfterLocalChange();
        }
    }

    function exporterExcel() {
        if (!Array.isArray(donnees) || donnees.length === 0) { alert("Aucune saisie à exporter."); return false; }
        if (window.Android && typeof Android.exportExcel === 'function') {
            try { Android.exportExcel(JSON.stringify(donnees)); return true; } catch (e) { console.warn(e); }
        }
        if (window.electronAPI && typeof window.electronAPI.exportExcel === 'function') {
            window.electronAPI.exportExcel(donnees).then(resultat => {
                if (resultat && resultat.error) alert('Erreur export Excel : ' + resultat.error);
            }).catch(e => alert('Erreur export Excel : ' + e.message));
            return true;
        }
        if (typeof XLSX === 'undefined') {
            alert("La bibliothèque Excel n'est pas encore chargée. Vérifiez la connexion Internet puis réessayez dans quelques secondes. Aucun fichier CSV ne sera créé.");
            return false;
        }
        const ordre = ["Date", "IDPROJET", "Groupe", "Type", "Dossier", "Détails", "Temps Reel", "Calcul"];
        const toutes = [...new Set(donnees.flatMap(row => Object.keys(row)))];
        const headers = ordre.filter(h => toutes.includes(h));
        toutes.forEach(h => { if (!headers.includes(h) && h !== 'S') headers.push(h); });
        const colLetter = n => XLSX.utils.encode_col(n-1);
        const parseMinutes = value => { const m=String(value||'').trim().match(/^(\d{1,3}):(\d{1,2})(?::\d{1,2})?$/); return m ? Number(m[1])*60+Number(m[2]) : (typeof value==='number'?Math.round(value*1440):0); };
        const serial = minutes => minutes / 1440;
        const dateCol=headers.indexOf('Date')+1, timeCol=headers.indexOf('Temps Reel')+1, calcCol=headers.indexOf('Calcul')+1;
        const groupCol=headers.indexOf('Groupe')+1, projectCol=headers.indexOf('IDPROJET')+1;
        const dates=[...new Set(donnees.map(r=>String(r.Date||'')).filter(Boolean))];
        const groupes=[...new Set(donnees.map(r=>String(r.Groupe||'').trim()||'Sans groupe'))];
        const projets=[...new Set(donnees.map(r=>String(r.IDPROJET||'').trim()).filter(Boolean))];
        const minutesByDate={}, minutesByDateGroup={}, minutesByDateProject={}, minutesByGroup={}, minutesByProject={};
        donnees.forEach(r=>{
            const d=String(r.Date||''), g=String(r.Groupe||'').trim()||'Sans groupe', pr=String(r.IDPROJET||'').trim();
            const mins=parseMinutes(r['Temps Reel']);
            minutesByDate[d]=(minutesByDate[d]||0)+mins;
            minutesByDateGroup[d] ||= {}; minutesByDateGroup[d][g]=(minutesByDateGroup[d][g]||0)+mins;
            minutesByDateProject[d] ||= {}; if(pr) minutesByDateProject[d][pr]=(minutesByDateProject[d][pr]||0)+mins;
            minutesByGroup[g]=(minutesByGroup[g]||0)+mins; if(pr) minutesByProject[pr]=(minutesByProject[pr]||0)+mins;
        });
        const pastel=['E8F1FF','E8F8EE','FFF5D9','FCE8F3','F0E8FF'];
        const projectColors=['DDEBF7','E2F0D9','FFF2CC','FCE4D6','E4DFEC'];
        const projectColor=pr=>{const v=String(pr||'').trim().toUpperCase();if(v==='6D3793')return 'C8E5F3';if(v==='A35550')return 'E6CEE6';const ix=projets.findIndex(x=>String(x).trim()===String(pr).trim());return projectColors[Math.max(0,ix)%projectColors.length];};
        const style=(fill,bold=false,align='center')=>({fill:{patternType:'solid',fgColor:{rgb:fill}},font:{bold,color:'172033'},alignment:{vertical:'center',horizontal:align,wrapText:true},border:{bottom:{style:'thin',color:{rgb:'D1D5DB'}}}});
        const headerStyle={fill:{patternType:'solid',fgColor:{rgb:'BFECC8'}},font:{bold:true,color:{rgb:'172033'}},alignment:{vertical:'center',horizontal:'center',wrapText:true},border:{bottom:{style:'medium',color:{rgb:'6B9F78'}}}};
        const rows=[headers, ...donnees.map(r=>headers.map(h=>h==='Temps Reel'?serial(parseMinutes(r[h])):h==='Calcul'?'':(r[h]==null?'':r[h])))];
        const ws=XLSX.utils.aoa_to_sheet(rows);
        const lastIndex={}; donnees.forEach((r,i)=>lastIndex[String(r.Date||'')]=i);
        if(dateCol && timeCol && calcCol){const dL=colLetter(dateCol),tL=colLetter(timeCol);donnees.forEach((r,i)=>{const n=i+2;const isLast=lastIndex[String(r.Date||'')]==i;ws[XLSX.utils.encode_cell({r:n-1,c:calcCol-1})]=isLast?{t:'n',v:serial(minutesByDate[String(r.Date||'')]||0),f:`IF(COUNTIF($${dL}$2:$${dL}$10000,${dL}${n})=COUNTIF($${dL}$2:${dL}${n},${dL}${n}),SUMIF($${dL}$2:$${dL}$10000,${dL}${n},$${tL}$2:$${tL}$10000),"")`,z:'[h]:mm'}:{t:'s',v:''};});}
        ws['!cols']=headers.map(h=>({wch:({Date:14,IDPROJET:15,Groupe:18,Type:25,Dossier:25,Détails:42,'Temps Reel':14,Calcul:12})[h]||18}));
        ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:0,c:headers.length-1}})};
        ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:donnees.length,c:headers.length-1}});
        ws['!freeze']={xSplit:0,ySplit:1};
        headers.forEach((h,c)=>{const cell=ws[XLSX.utils.encode_cell({r:0,c})];if(cell)cell.s=headerStyle;});
        donnees.forEach((r,i)=>headers.forEach((h,c)=>{const cell=ws[XLSX.utils.encode_cell({r:i+1,c})];if(!cell)return;let fill='FFFFFF';if(h==='Date')fill=pastel[Math.max(0,dates.indexOf(String(r.Date||'')))%pastel.length];if(h==='IDPROJET'&&r.IDPROJET)fill=projectColor(r.IDPROJET);cell.s=style(fill,false,h==='Détails'?'left':h==='Temps Reel'?'right':'center');if(h==='Temps Reel'||h==='Calcul')cell.z='[h]:mm';}));
        const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Suivi');
        // Résumé par groupe : valeurs calculées immédiatement + formules pour les modifications ultérieures dans Excel.
        const gs=[['Total des heures par groupe'],[],['Date',...groupes,'Total jour']];
        dates.forEach((date,i)=>{const rr=i+4,row=[date];groupes.forEach((g,j)=>{const c=j+2,L=colLetter(c),mins=(minutesByDateGroup[date]||{})[g]||0;row.push({t:'n',v:serial(mins),f:`SUMIFS(Suivi!$${colLetter(timeCol)}$2:$${colLetter(timeCol)}$10000,Suivi!$${colLetter(dateCol)}$2:$${colLetter(dateCol)}$10000,$A${rr},Suivi!$${colLetter(groupCol)}$2:$${colLetter(groupCol)}$10000,${g==='Sans groupe'?'""':`${L}$3`})`,z:'[h]:mm'});});const total=groupes.reduce((a,g)=>a+((minutesByDateGroup[date]||{})[g]||0),0);row.push({t:'n',v:serial(total),f:`SUM(B${rr}:${colLetter(groupes.length+1)}${rr})`,z:'[h]:mm'});gs.push(row);});
        const gt=dates.length+4,gr=['TOTAL GÉNÉRAL'];groupes.forEach((g,j)=>{const L=colLetter(j+2);gr.push({t:'n',v:serial(minutesByGroup[g]||0),f:`SUM(${L}4:${L}${gt-1})`,z:'[h]:mm'});});const totalAll=Object.values(minutesByGroup).reduce((a,b)=>a+b,0);gr.push({t:'n',v:serial(totalAll),f:`SUM(B${gt}:${colLetter(groupes.length+1)}${gt})`,z:'[h]:mm'});gs.push(gr);
        const wg=XLSX.utils.aoa_to_sheet(gs);wg['!cols']=[{wch:18},...groupes.map(()=>({wch:18})),{wch:18}];wg['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:gs.length-1,c:groupes.length+1}});gs.forEach((row,ri)=>row.forEach((v,ci)=>{const cell=wg[XLSX.utils.encode_cell({r:ri,c:ci})];if(cell){cell.s=(ri===2||ri===gs.length-1)?headerStyle:style(ri%2?'F8FAFC':'FFFFFF',ri===gs.length-1,ci===0?'left':'center');if(ri>=3&&ci>0)cell.z='[h]:mm';}}));XLSX.utils.book_append_sheet(wb,wg,'Totaux groupes');
        // Totaux par projet et par jour, puis total de la période exportée.
        const ps=[['Date',...projets,'Total jour']];
        dates.forEach((date,i)=>{const rr=i+2,row=[date];projets.forEach((pr,j)=>{const c=j+2,L=colLetter(c),mins=(minutesByDateProject[date]||{})[pr]||0;row.push({t:'n',v:serial(mins),f:`SUMIFS(Suivi!$${colLetter(timeCol)}$2:$${colLetter(timeCol)}$10000,Suivi!$${colLetter(dateCol)}$2:$${colLetter(dateCol)}$10000,$A${rr},Suivi!$${colLetter(projectCol)}$2:$${colLetter(projectCol)}$10000,${L}$1)`,z:'[h]:mm'});});const total=projets.reduce((a,pr)=>a+((minutesByDateProject[date]||{})[pr]||0),0);row.push({t:'n',v:serial(total),f:`SUM(B${rr}:${colLetter(projets.length+1)}${rr})`,z:'[h]:mm'});ps.push(row);});
        const pt=dates.length+2,prTotal=['TOTAL SEMAINE'];projets.forEach((pr,j)=>{const L=colLetter(j+2);prTotal.push({t:'n',v:serial(minutesByProject[pr]||0),f:`SUM(${L}2:${L}${pt-1})`,z:'[h]:mm'});});const totalProject=Object.values(minutesByProject).reduce((a,b)=>a+b,0);prTotal.push({t:'n',v:serial(totalProject),f:`SUM(B${pt}:${colLetter(projets.length+1)}${pt})`,z:'[h]:mm'});ps.push(prTotal);
        const wp=XLSX.utils.aoa_to_sheet(ps);wp['!cols']=[{wch:18},...projets.map(()=>({wch:18})),{wch:18}];wp['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:ps.length-1,c:projets.length+1}});ps.forEach((row,ri)=>row.forEach((v,ci)=>{const cell=wp[XLSX.utils.encode_cell({r:ri,c:ci})];if(cell){cell.s=(ri===0||ri===ps.length-1)?headerStyle:style(ri%2?'F8FAFC':'FFFFFF',ri===ps.length-1,ci===0?'left':'center');if(ri>0&&ci>0)cell.z='[h]:mm';}}));XLSX.utils.book_append_sheet(wb,wp,'Totaux projets');
        wb.Workbook=wb.Workbook||{};wb.Workbook.CalcPr={calcMode:'auto',fullCalcOnLoad:true,forceFullCalc:true};
        XLSX.writeFile(wb,'Suivi_Proximite_ASEI.xlsx',{bookType:'xlsx',cellDates:false,cellStyles:true});
        return true;
    }

    // Ancienne fonction CSV conservée uniquement pour compatibilité avec les appels historiques.
    function exporterCSVFallback() { return exporterExcel(); }

    function formatDateFR(dateValue) {
        if (!dateValue) return '';
        if (dateValue instanceof Date) {
            if (isNaN(dateValue.getTime())) return '';
            return `${String(dateValue.getDate()).padStart(2, '0')}/${String(dateValue.getMonth() + 1).padStart(2, '0')}/${dateValue.getFullYear()}`;
        }
        const value = String(dateValue);
        const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (match) return `${match[3]}/${match[2]}/${match[1]}`;
        return value;
    }

    function envoyerMailJour() {
        if (donnees.length === 0) return alert("Aucune donnée saisie !");
        exporterExcel();

        const dateVal = document.getElementById('dateInput').value;
        const dateFormatted = dateVal ? `${dateVal.split('-')[2]}/${dateVal.split('-')[1]}/${dateVal.split('-')[0]}` : formatDateFR(new Date());

        const destinataire = document.getElementById('emailDestinataire')?.value || listes.emails[0] || 'Xavier.delpratrouan@spie.com';
        const objet = `Fichier suivi du jour ${dateFormatted}`;
        const corps = `Bonjour, voici le fichier de suivi à contrôler\nCordialement,`;

        setTimeout(() => {
            if (window.Android && Android.mail) Android.mail(destinataire, objet, corps); else window.location.href = `mailto:${destinataire}?subject=${encodeURIComponent(objet)}&body=${encodeURIComponent(corps)}`;
        }, 1000);
    }

    function envoyerMailSemaine() {
        if (donnees.length === 0) return alert("Aucune donnée saisie !");
        exporterExcel();

        const dateVal = document.getElementById('dateInput').value;
        const refDate = dateVal ? new Date(dateVal) : new Date();
        const numSemaine = getIsoWeek(refDate.toISOString().split('T')[0]);

        const day = refDate.getDay();
        const monday = new Date(refDate);
        monday.setDate(refDate.getDate() + (day === 0 ? -6 : 1 - day));
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        const destinataire = document.getElementById('emailDestinataire')?.value || listes.emails[0] || 'Xavier.delpratrouan@spie.com';
        const objet = `Fichier suivi de la semaine ${numSemaine} du ${formatDateFR(monday)} au ${formatDateFR(sunday)}`;
        const corps = `Bonjour, voici le fichier de suivi à contrôler\nCordialement,`;

        setTimeout(() => {
            if (window.Android && Android.mail) Android.mail(destinataire, objet, corps); else window.location.href = `mailto:${destinataire}?subject=${encodeURIComponent(objet)}&body=${encodeURIComponent(corps)}`;
        }, 1000);
    }
